org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=512m
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 compatibility opt-outs (matches the Flutter 3.50 stable template):
# - newDsl=false keeps the legacy android-block DSL. Flutter's own Gradle
#   plugin and several ecosystem plugins still target the pre-AGP-9 DSL.
# - builtInKotlin=false keeps the explicit org.jetbrains.kotlin.android plugin
#   applied in app/build.gradle.kts working; AGP 9 otherwise force-enables
#   built-in Kotlin.
# Remove these only when all plugins are migrated to the AGP 9 DSL (opt-out is
# scheduled for removal in AGP 10).
android.newDsl=false
android.builtInKotlin=false
